services:
  portainer:
    image: portainer/portainer-ce:2.38.0-alpine
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    expose:
      - 9000
    networks:
      - nginx_internal # attach if exposing though nginx, otherwise export expose through port 9000
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "portainer_data:/data"
    restart: unless-stopped

volumes:
  portainer_data:
    external: true

networks:
  nginx_internal:
    external: true
