services:
  gitea:
    image: gitea/gitea:latest
    environment:
      - DB_TYPE=postgres
      - DB_HOST=db:5432
      - DB_NAME=gitea
      - DB_USER=gitea
      - DB_PASSWD=gitea
      - GITEA__server__SSH_PORT=2222
    restart: always
    volumes:
      - git_data:/data
    ports:
      - 3000:3000
      - 2222:22

  db:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    restart: always
    volumes:
      - git_db_data:/var/lib/postgresql/data
    expose:
      - 5432

volumes: ## CREATE THESE VOLUMES FIRST!!
  git_db_data:
    external: true 
  git_data:
    external: true
