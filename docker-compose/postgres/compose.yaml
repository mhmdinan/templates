services:
  postgres:
    #image: postgres:latest # To download the latest image
    image: postgres:18.3-alpine # To download a specific version
    container_name: postgres
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: name
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432" # expose directly through host_port:container_port

volumes:
  pg_data: #Make this external docker volume first 
    external: true
