server {
    listen 443 ssl;
    http2 on;
    server_name portainer.example.com;

    ssl_certificate     /etc/certbot/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/example.com/privkey.pem;


    location / {
        proxy_pass https://portainer:9443;  # set docker container_name: portainer and attach nginx network

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running connections
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # disable verification since portainer uses its own certificates
        proxy_ssl_verify off;
    }
}