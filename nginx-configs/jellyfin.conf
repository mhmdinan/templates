server {
    listen 443 ssl;
    http2 on;

    server_name jellyfin.example.com;

    ssl_certificate     /etc/certbot/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/example.com/privkey.pem;


    client_max_body_size 20M;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    location / {
        proxy_pass http://jellyfin:8096; # set docker container_name: portainer and attach nginx network
        proxy_buffering off;  # recommended for streaming
    }
}
