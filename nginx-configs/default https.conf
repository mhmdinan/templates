server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri; #reroute to HTTPS if you have certificates
    }

    server {
    listen 443 ssl default_server;
    server_name example.com _;

    ssl_certificate     /etc/certbot/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/example.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html index.htm;
    error_page 404 /404.html;
}

}