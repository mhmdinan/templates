server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

	ssl_certificate     /etc/certbot/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/certbot/live/example.com/privkey.pem;

    location / {
        proxy_pass http://website:3000;          # using next js site in a docker container

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout                 300;
        proxy_connect_timeout              300;
        proxy_send_timeout                 300;
    }

    #deny access to hidden files
    location ~ /\. {
        deny all;
    }

    error_log /var/log/nginx/website_error.log;
    access_log /var/log/nginx/website_access.log;
}
